name: AWSデプロイ

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  INSTANCE_ID: i-06c91534794954ce6
  BUCKET: koukoku-navi-deploy-392207608429
  ROLE_ARN: arn:aws:iam::392207608429:role/github-actions-koukoku-navi

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: adsフォルダを固める
        run: tar -czf app.tar.gz -C ads .

      - name: AWS認証 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: S3へアップロードし署名付きURLを発行
        id: up
        run: |
          set -e
          KEY="app-${GITHUB_SHA}.tar.gz"
          aws s3 cp app.tar.gz "s3://$BUCKET/$KEY"
          URL=$(aws s3 presign "s3://$BUCKET/$KEY" --expires-in 900)
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: SSM経由でサーバーへ配置
        run: |
          set -e
          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy koukokunavi ${GITHUB_SHA::7}" \
            --parameters commands="set -e; \
              curl -sSf -o /tmp/app.tar.gz '${{ steps.up.outputs.url }}'; \
              tar -xzf /tmp/app.tar.gz -C /var/www/html; \
              rm -f /tmp/app.tar.gz; \
              nginx -t; \
              echo DEPLOY_OK" \
            --query Command.CommandId --output text)
          echo "CommandId: $CMD"

          STATUS=Pending
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 5
          done

          echo "--- サーバー出力 ---"
          aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "::error::デプロイ失敗 ($STATUS)"
            aws ssm get-command-invocation --command-id "$CMD" \
              --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text || true
            exit 1
          fi

      - name: 公開URLの応答を確認
        run: |
          for u in https://app2.signage-ad.com/ https://app2.signage-ad.com/koukokunavi.html; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u")
            echo "$u -> $code"
            [ "$code" = "200" ] || exit 1
          done
