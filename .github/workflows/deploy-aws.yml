name: AWSデプロイ

# main     → 本番 EC2 koukokunavi-production (i-06c91534794954ce6)  https://app.signage-ad.com/   (/var/www/html)
# staging  → 検証 EC2 koukokunavi-staging    (i-01952f2e12214d8f0)  https://app2.signage-ad.com/  (/var/www/html)
# 10/7 構成図 v3 ③ 手順 11：検証を別 EC2 に分けたため、ブランチごとに配置先の EC2 を切り替える。
# 旧 /var/www/staging（本番 EC2 内の検証フォルダ）は使わない。
# サーバー側（Django）は別リポジトリ koukokunavi-backend のため、ここでは画面（ads/）だけを配る。

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  PROD_INSTANCE_ID: i-06c91534794954ce6
  STAGING_INSTANCE_ID: i-01952f2e12214d8f0
  BUCKET: koukoku-navi-deploy-392207608429
  ROLE_ARN: arn:aws:iam::392207608429:role/github-actions-koukoku-navi

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: デプロイ先を決定
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "instance=$PROD_INSTANCE_ID"     >> "$GITHUB_OUTPUT"
            echo "dir=/var/www/html"              >> "$GITHUB_OUTPUT"
            echo "url=https://app.signage-ad.com" >> "$GITHUB_OUTPUT"
            echo "env=本番" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "staging" ]; then
            echo "instance=$STAGING_INSTANCE_ID"   >> "$GITHUB_OUTPUT"
            echo "dir=/var/www/html"               >> "$GITHUB_OUTPUT"
            echo "url=https://app2.signage-ad.com" >> "$GITHUB_OUTPUT"
            echo "env=ステージング" >> "$GITHUB_OUTPUT"
          else
            echo "::error::main と staging 以外のブランチは配置しません（$GITHUB_REF_NAME）"
            exit 1
          fi

      - name: デプロイ内容を表示
        run: |
          echo "ブランチ : $GITHUB_REF_NAME"
          echo "環境     : ${{ steps.target.outputs.env }}"
          echo "EC2      : ${{ steps.target.outputs.instance }}"
          echo "配置先   : ${{ steps.target.outputs.dir }}"
          echo "URL      : ${{ steps.target.outputs.url }}"

      - name: adsフォルダを固める
        run: tar -czf app.tar.gz -C ads .

      - name: AWS認証 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: S3へアップロードし署名付きURLを発行
        id: up
        run: |
          set -e
          KEY="app-${GITHUB_REF_NAME}-${GITHUB_SHA}.tar.gz"
          aws s3 cp app.tar.gz "s3://$BUCKET/$KEY"
          URL=$(aws s3 presign "s3://$BUCKET/$KEY" --expires-in 900)
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: SSM経由でサーバーへ配置
        env:
          PRESIGNED_URL: ${{ steps.up.outputs.url }}
          TARGET_DIR: ${{ steps.target.outputs.dir }}
          INSTANCE_ID: ${{ steps.target.outputs.instance }}
        run: |
          set -e

          # 署名付きURLは & や = を含むため、短縮記法ではなくJSONで渡す
          cat > mkparams.py <<'PY'
          import json, os

          url = os.environ["PRESIGNED_URL"]
          target = os.environ["TARGET_DIR"]
          command = (
              "set -e; "
              "curl -sSf -o /tmp/app.tar.gz '" + url + "'; "
              "mkdir -p " + target + "; "
              "tar -xzf /tmp/app.tar.gz -C " + target + "; "
              "rm -f /tmp/app.tar.gz; "
              "nginx -t; "
              "echo DEPLOY_OK " + target
          )
          with open("params.json", "w") as f:
              json.dump({"commands": [command]}, f)
          PY
          python3 mkparams.py

          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy koukokunavi ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "CommandId: $CMD"
          rm -f params.json mkparams.py

          STATUS=Pending
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 5
          done

          echo "--- サーバー出力 ---"
          aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "::error::デプロイ失敗 ($STATUS)"
            aws ssm get-command-invocation --command-id "$CMD" \
              --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text || true
            exit 1
          fi

      - name: 公開URLの応答を確認
        run: |
          BASE="${{ steps.target.outputs.url }}"
          for p in "/" "/admin.html"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$p")
            echo "$BASE$p -> $code"
            [ "$code" = "200" ] || exit 1
          done
          echo "✅ ${{ steps.target.outputs.env }} へのデプロイ完了: $BASE"
